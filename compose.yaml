services:
  app:
    build: .
    ports:
      - "5174:5174"
    env_file:
      - .env
    environment:
      # Overrides .env: inside the container the database belongs on the volume.
      DB_PATH: /app/data/clinic.db
      API_PORT: "5174"
    volumes:
      # Named volume, not a bind mount: the database survives rebuilds and is
      # not accidentally committed from the working tree.
      - clinic-data:/app/data
    restart: unless-stopped

volumes:
  clinic-data:
